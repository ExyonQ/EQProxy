# nginx de ejemplo para probar eqproxy_migrate.py
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    gzip on;
    gzip_types text/css application/json;

    # backend de aplicaciones
    upstream app {
        least_conn;
        server 10.0.0.10:8080 weight=3 max_fails=3 fail_timeout=30s;
        server 10.0.0.11:8080;
        server 10.0.0.12:8080 backup;
        keepalive 32;
    }

    upstream api_v2 {
        server 10.0.1.20:9000 weight=5;
        server 10.0.1.21:9000 weight=2;
    }

    # redirección 80 → 443
    server {
        listen 80;
        server_name ejemplo.com www.ejemplo.com;
        return 301 https://$host$request_uri;
    }

    # sitio principal
    server {
        listen 443 ssl;
        http2 on;
        server_name ejemplo.com;

        ssl_certificate     /etc/ssl/certs/ejemplo.pem;
        ssl_certificate_key /etc/ssl/private/ejemplo.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL;

        client_header_timeout 10s;
        keepalive_timeout 65s;

        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }

        location /api/ {
            proxy_pass http://api_v2;
            proxy_set_header Host $host;
            limit_req zone=api burst=20;
        }

        location /static/ {
            root /var/www;
            expires 30d;
        }

        add_header X-Frame-Options SAMEORIGIN always;
    }

    # vhost adicional sobre el mismo 443 (virtual host)
    server {
        listen 443 ssl;
        server_name panel.ejemplo.com;
        ssl_certificate     /etc/ssl/certs/panel.pem;
        ssl_certificate_key /etc/ssl/private/panel.key;

        location / {
            proxy_pass http://10.0.2.5:3000;
        }
        auth_basic "restringido";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }
}
