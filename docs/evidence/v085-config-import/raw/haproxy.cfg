# HAProxy de ejemplo para probar eqproxy_migrate.py
global
    log /dev/log local0
    maxconn 50000
    nbthread 4
    stats socket /run/haproxy/admin.sock mode 660 level admin
    daemon

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option forwardfor
    retries 3
    option redispatch
    timeout connect 4s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout queue 30s
    timeout check 5s

frontend fe_https
    bind 0.0.0.0:443 ssl crt /etc/haproxy/certs/ejemplo.pem alpn h2,http/1.1
    bind 0.0.0.0:8443 ssl crt /etc/haproxy/certs/ejemplo.pem
    mode http
    maxconn 20000
    default_backend bk_web
    http-request set-header X-Forwarded-Proto https
    http-request deny if { src 10.9.9.9 }
    capture request header Host len 64

frontend fe_tcp_ssh
    bind 0.0.0.0:2222
    mode tcp
    default_backend bk_ssh
    timeout client 10m

backend bk_web
    mode http
    balance leastconn
    option httpchk GET /healthz HTTP/1.1
    cookie SERVERID insert indirect nocache
    http-response set-header Server mi-servidor
    server web1 10.0.0.10:8080 check inter 2s fall 3 rise 2 weight 100 send-proxy
    server web2 10.0.0.11:8080 check inter 2s fall 3 rise 2 weight 50 send-proxy
    server web3 10.0.0.12:8080 backup check
    server web4 ejemplocpuerta.local:8080 check

backend bk_ssh
    mode tcp
    balance source
    server ssh1 10.0.0.30:22 check
    server ssh2 10.0.0.31:22 check send-proxy-v2

listen stats
    bind 127.0.0.1:9000
    mode http
    stats enable
    stats uri /haproxy?stats
    default_backend bk_web

listen app_tcp
    bind 0.0.0.0:3306
    mode tcp
    timeout connect 5s
    server db1 10.0.3.5:3306 check inter 5s fall 2 rise 2 ssl verify none sni db.interno
