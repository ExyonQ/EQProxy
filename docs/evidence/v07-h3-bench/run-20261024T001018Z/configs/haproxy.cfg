global
  maxconn 20000
defaults
  mode http
  timeout connect 5s
  timeout client 30s
  timeout server 30s
frontend fe
  bind :19443 ssl crt /certs/haproxy.pem alpn h2,http/1.1
  bind quic4@:19443 ssl crt /certs/haproxy.pem quic-cc-algo cubic
  default_backend be
backend be
  server origin origin:9000
