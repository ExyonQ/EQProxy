global
  log stdout format raw local0
  maxconn 4096
defaults
  log global
  mode http
  option httplog
  option http-keep-alive
  option httpchk GET /
  default-server inter 2s fall 3 rise 2
  timeout check 5s
  timeout connect 5s
  timeout client 60s
  timeout server 60s
  timeout http-request 5s
frontend web
  bind *:19501
  default_backend pool
