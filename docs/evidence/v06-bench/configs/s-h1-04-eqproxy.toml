schema_version = 1
shutdown_grace = "5s"

[listener.web]
listen = "0.0.0.0:19401"
mode = "http"
backend = "api"
maxconn = 4096

[[listener.web.rules]]
name = "r01-host"
host = "host1.example"
use_backend = "api"

[[listener.web.rules]]
name = "r02-path"
