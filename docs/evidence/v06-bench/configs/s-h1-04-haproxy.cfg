global
  log stdout format raw local0
  maxconn 4096
defaults
  log global
  mode http
  option httplog
  option http-keep-alive
  option httpchk GET /
  default-server inter 2s fall 3 rise 2
  timeout check 5s
  timeout connect 5s
  timeout client 60s
  timeout server 60s
  timeout http-request 5s
frontend web
  bind *:19401
  default_backend api
  acl r01 hdr(host) -i host1.example
  acl r02 path_beg /p2/
  acl r03 method POST
  acl r04 hdr(x-tag) -i t4
  acl r05 hdr(host) -i host5.example
  acl r06 path_beg /p6/
  acl r07 method POST
  acl r08 hdr(x-tag) -i t8
  acl r09 hdr(host) -i host9.example
  acl r10 path_beg /p10/
  acl r11 method POST
  acl r12 hdr(x-tag) -i t12
  acl r13 hdr(host) -i host13.example
  acl r14 path_beg /p14/
  acl r15 method POST
  acl r16 hdr(x-tag) -i t16
  acl r17 hdr(host) -i host17.example
  acl r18 path_beg /p18/
  acl r19 method POST
  acl r20 path_beg /bench/
  http-request set-path %[path,regsub(^/bench/,/api/)] if r20
  http-request set-header x-beta on if r20
  http-request add-header x-hint extra if r20
  http-request del-header x-gone if r20
  http-response set-header x-marker v06
  use_backend api if r01
  use_backend mgmt if r02
  use_backend api if r03
  use_backend mgmt if r04
  use_backend api if r05
  use_backend mgmt if r06
  use_backend api if r07
  use_backend mgmt if r08
  use_backend api if r09
  use_backend mgmt if r10
  use_backend api if r11
  use_backend mgmt if r12
  use_backend api if r13
  use_backend mgmt if r14
  use_backend api if r15
  use_backend mgmt if r16
  use_backend api if r17
  use_backend mgmt if r18
  use_backend api if r19
  use_backend api if r20
frontend l2
  bind *:19402
  default_backend b3
