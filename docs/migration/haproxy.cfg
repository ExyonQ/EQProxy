# EQProxy migration matrix — source config: HAProxy 3.4
#
# A realistic edge config for the demo deployment of docs/migration/README.md:
# two vhosts (shop/api), header/cookie canary, method-scoped admin writes, one
# redirect, one local health answer and a prefix rewrite. The backends are the
# five echo servers of the harness (subnet 172.24.0.0/24, ids: web, api,
# admin, canary, fallback). Translation: docs/migration/eqproxy.toml.

global
    log stdout format raw local0
    maxconn 256

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend fe
    bind :8080

    # Local answers before any backend is contacted.
    http-request return status 200 content-type "text/plain" string "ok" if { path /healthz }
    http-request redirect code 301 location /blog if { path /old/blog }

    # rewrite-target: /api/v1/<rest> -> /api/<rest> on api.example.com
    # (http-request rules run before use_backend, so the routing below
    # matches the rewritten path).
    http-request set-path %[path,regsub(^/api/v1/,/api/)] if { hdr(host),lower,field(1,:) -m str api.example.com } { path_beg /api/v1/ }

    # Routing (ordered: first match wins).
    use_backend admin if { hdr(host),lower,field(1,:) -m str shop.example.com } { path_beg /admin } { method POST }
    use_backend api if { hdr(host),lower,field(1,:) -m str shop.example.com } { path_beg /reports/ }
    use_backend canary if { hdr(host),lower,field(1,:) -m str shop.example.com } !{ path_beg /admin } { cook(canary) -m str on }
    use_backend canary if { hdr(host),lower,field(1,:) -m str shop.example.com } !{ path_beg /admin } { hdr(x-canary) -m str on }
    use_backend api if { hdr(host),lower,field(1,:) -m str api.example.com } { path -m reg \.json$ }
    use_backend api if { hdr(host),lower,field(1,:) -m str api.example.com } { path_beg /api/ }
    use_backend web if { hdr(host),lower,field(1,:) -m str shop.example.com }
    default_backend fallback

backend web
    server s1 172.24.0.11:80
backend api
    server s1 172.24.0.12:80
backend admin
    server s1 172.24.0.13:80
backend canary
    server s1 172.24.0.14:80
backend fallback
    server s1 172.24.0.15:80
