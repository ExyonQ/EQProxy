# EQProxy migration matrix — source config: nginx (operator-written)
#
# The same demo deployment as docs/migration/haproxy.cfg, written the way an
# operator writes nginx: one server block per vhost, prefix/exact/regex
# locations, maps for the canary and method conditions and one rewrite.
# Conditional proxy_pass targets are IP:port strings because nginx resolves
# variable targets without the upstream table.
# Translation: docs/migration/eqproxy.toml.

worker_processes 2;
pid /tmp/mig-nginx.pid;

events {
    worker_connections 128;
}

http {
    client_body_temp_path /tmp/mig-client-body;
    proxy_temp_path /tmp/mig-proxy-temp;
    access_log off;

    # Canary selection (canary-by-header / canary-by-cookie semantics:
    # the header wins when both are present).
    map "$cookie_canary:$http_x_canary" $shop_target {
        "on:"     172.24.0.14:80;
        ":on"     172.24.0.14:80;
        "on:on"   172.24.0.14:80;
        default   172.24.0.11:80;
    }

    upstream api_backend      { server 172.24.0.12:80; }
    upstream fallback_backend { server 172.24.0.15:80; }

    # api.example.com: API vhost.
    server {
        listen 8080;
        server_name api.example.com;

        # rewrite-target: /api/v1/<rest> -> /api/<rest>.
        location ^~ /api/v1/ {
            rewrite ^/api/v1/(.*)$ /api/$1 break;
            proxy_pass http://api_backend;
        }
        location ~* \.json$ {
            proxy_pass http://api_backend;
        }
        location /api/ {
            proxy_pass http://api_backend;
        }
        location / {
            proxy_pass http://fallback_backend;
        }
    }

    # shop.example.com: storefront vhost.
    server {
        listen 8080;
        server_name shop.example.com;

        location = /healthz {
            return 200 "ok";
        }
        location = /old/blog {
            return 301 /blog;
        }
        location /admin {
            # Method-scoped routing (the way operators write it).
            if ($request_method = POST) { proxy_pass http://172.24.0.13:80; }
            proxy_pass http://172.24.0.11:80;
        }
        location /reports {
            proxy_pass http://172.24.0.12:80;
        }
        location / {
            proxy_pass http://$shop_target;
        }
    }

    # Default server: everything else reaches the fallback pool.
    server {
        listen 8080 default_server;
        server_name _;

        location / {
            proxy_pass http://fallback_backend;
        }
    }
}
