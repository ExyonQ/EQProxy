# EQProxy migration matrix — ingress-nginx controller-shaped config
#
# The config the ingress-nginx controller (v1.13.0) generates for
# docs/migration/ingress.yaml, in the shapes it emits: one server per host,
# a canary map pair (header wins over cookie) feeding the storefront upstream,
# snippet directives at the top of their locations, the rewrite for the regex
# path and a default server for the default backend. The harness runs THIS
# file (the controller's object->config translation itself is not exercised:
# the same declared limitation as the differential corpus).
#
# Service endpoints stand in for the cluster Services:
#   web=172.24.0.11  api=172.24.0.12  admin=172.24.0.13
#   canary=172.24.0.14  fallback=172.24.0.15

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/mig-nginx.pid;

events {
    worker_connections 128;
}

http {
    client_body_temp_path /tmp/mig-client-body;
    proxy_temp_path /tmp/mig-proxy-temp;
    access_log off;

    # canary-by-header + canary-by-cookie (header takes precedence).
    map $http_x_canary $canary_x_canary { default "off"; "on" "on"; }
    map $cookie_canary $canary_cookie { default "off"; "on" "on"; }
    map "$canary_x_canary$canary_cookie" $shop_web_upstream {
        default 172.24.0.11:80;
        "onoff" 172.24.0.14:80;
        "onon"  172.24.0.14:80;
        "offon" 172.24.0.14:80;
    }

    server {
        listen 8080;
        server_name shop.example.com;

        location = /healthz {
            return 200 "ok";
            proxy_pass http://172.24.0.11:80;
        }
        location = /old/blog {
            return 301 /blog;
            proxy_pass http://172.24.0.11:80;
        }
        location /admin {
            if ($request_method = POST) { proxy_pass http://172.24.0.13:80; }
            proxy_pass http://172.24.0.11:80;
        }
        location /reports {
            proxy_pass http://172.24.0.12:80;
        }
        location / {
            proxy_pass http://$shop_web_upstream;
        }
    }

    server {
        listen 8080;
        server_name api.example.com;

        location ~* "^/api/v1/(.*)$" {
            rewrite ^/api/v1/(.*)$ /api/$1 break;
            proxy_pass http://172.24.0.12:80;
        }
        location /api {
            proxy_pass http://172.24.0.12:80;
        }
        location / {
            proxy_pass http://172.24.0.15:80;
        }
    }

    server {
        listen 8080 default_server;
        server_name _;

        location / {
            proxy_pass http://172.24.0.15:80;
        }
    }
}
