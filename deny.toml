# Política de dependencias de EQProxy (cargo-deny).
# Licencias permitidas = MIT OR Apache-2.0 (decisión de proyecto) + las
# permisivas estándar del ecosistema Rust. Cualquier otra requiere ADR.
#
# ISC y MIT-0 (ambas OSI, permisivas) se añaden en Fase 2b con la cadena
# rustls/aws-lc (aws-lc-rs, aws-lc-sys); CDLA-Permissive-2.0 es la licencia
# de datos del almacén de raíces de Mozilla (webpki-roots). Todo permisivo.
# Documentado en la entrega 0.2.0.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
