# Política de dependencias de EQProxy (cargo-deny).
# Licencias permitidas = MIT OR Apache-2.0 (decisión de proyecto) + las
# permisivas estándar del ecosistema Rust. Cualquier otra requiere ADR.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
