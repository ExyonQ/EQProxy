# EQProxy dependency policy (cargo-deny).
# Allowed licenses = MIT OR Apache-2.0 (project decision) + the
# standard permissive ones of the Rust ecosystem. Any other requires an ADR.
#
# ISC and MIT-0 (both OSI, permissive) are added in Phase 2b with the chain
# rustls/aws-lc (aws-lc-rs, aws-lc-sys); CDLA-Permissive-2.0 is the license
# Mozilla root-store data (webpki-roots). All permissive.
# Documented in release 0.2.0.
#
# Zlib (OSI, permissive, no copyleft) is `foldhash`, pulled by hashbrown in
# wasmtime's Cranelift (ADR-0031); added by ADR-0033 after cargo-deny rejected
# the tree in the v0.8.5 plugin increment.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
