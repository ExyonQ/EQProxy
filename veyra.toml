# Veyra Proof audit — EQProxy.
#
# The E2E scenarios exercise the cargo-built `eqproxy` binary through
# its public interface (argv + stdin) and compare the observed
# (exit, stdout, stderr) against what is declared here. With no observable
# expectations a scenario is a finding (E2E00), not a pass.

[e2e]
binaries = ["eqproxy"]
timeout_seconds = 60

# Real happy path: a valid config is accepted and reports the summary.
# /dev/stdin delivers the config via stdin without checkout paths.
[[e2e.scenarios]]
name = "validate-accepts-valid-config"
argv = ["config", "validate", "--config", "/dev/stdin"]
stdin = '''
schema_version = 1

[listener.web]
listen = "127.0.0.1:8080"
backend = "app"

[backend.app]
server = "127.0.0.1:9000"
'''
expect_exit = 0
expect_stdout_regex = "config OK: 1 listener\\(s\\), 1 backend\\(s\\)"

# Actionable error: unsupported schema_version → exit 1 with field and example.
[[e2e.scenarios]]
name = "validate-reports-unsupported-schema-version"
argv = ["config", "validate", "--config", "/dev/stdin"]
stdin = '''
schema_version = 99
'''
expect_failure = true
expect_exit = 1
expect_stderr_regex = "schema_version = 99 not supported by this binary"

# Real invalid input: TOML with a syntax error → line and example.
[[e2e.scenarios]]
name = "validate-reports-syntax-error-with-line"
argv = ["config", "validate", "--config", "/dev/stdin"]
stdin = '''
schema_version = 1
listener.web listen =
'''
expect_failure = true
expect_exit = 1
expect_stderr_regex = "configuration error in /dev/stdin:[0-9]+"

# Missing file: explicit failure with cause and example; never silent
# success nor panic.
[[e2e.scenarios]]
name = "validate-with-missing-config-fails"
argv = ["config", "validate", "--config", "no-existe.toml"]
expect_failure = true
expect_exit = 1
expect_stderr_regex = "could not read the file"

# The dataplane does not half-start without config.
[[e2e.scenarios]]
name = "run-with-missing-config-fails"
argv = ["run", "--config", "no-existe.toml"]
expect_failure = true
expect_exit = 1
expect_stderr_regex = "could not read the file"

# Phase 8a: `config import` is implemented, so nothing holds the old
# "not implemented, exit 2" contract any more. Its failure path exits 1 and
# names the cause; the exit-2 case is now "converted with refused
# directives", covered by `eqproxy-cli/tests/cli_e2e.rs`.
[[e2e.scenarios]]
name = "config-import-unreadable-source-exits-1"
argv = ["config", "import", "--input", "a.cfg", "--output", "b.toml"]
expect_failure = true
expect_exit = 1
expect_stderr_regex = "cannot read a.cfg"

# Phase 3: `doctor` passes pre-flight on a free port (each scenario runs
# in a fresh sandbox cwd; port 0 always binds; warnings never fail).
[[e2e.scenarios]]
name = "doctor-passes-for-a-free-port"
argv = ["doctor", "--config", "/dev/stdin"]
stdin = '''
schema_version = 1
[listener.web]
listen = "127.0.0.1:0"
backend = "api"
[backend.api]
server = "127.0.0.1:9"
'''
expect_exit = 0
expect_stdout_regex = "doctor: PASS"

# Phase 3: `doctor` with a missing config fails explicitly (exit 1).
[[e2e.scenarios]]
name = "doctor-reports-missing-config"
argv = ["doctor", "--config", "no-existe.toml"]
expect_failure = true
expect_exit = 1
expect_stderr_regex = "could not read the file"

# Phase 3: `config apply` stores the first configuration offline and
# reports the activation inventory (each scenario runs in a fresh
# sandbox cwd, so `./.eqproxy` starts empty and stays isolated).
[[e2e.scenarios]]
name = "apply-stores-first-configuration"
argv = ["config", "apply", "--config", "/dev/stdin"]
stdin = '''
schema_version = 1
[listener.web]
listen = "127.0.0.1:8080"
mode = "http"
backend = "api"
[backend.api]
servers = [{ addr = "127.0.0.1:9000", weight = 3 }]
'''
expect_exit = 0
expect_stdout_regex = "applied:.*\\(no previous configuration\\)"

# Phase 3: `config rollback` with no history fails explicitly (exit 1),
# never inventing a configuration.
[[e2e.scenarios]]
name = "rollback-without-history-fails"
argv = ["config", "rollback"]
expect_failure = true
expect_exit = 1
expect_stderr_regex = "no previous configuration"

# Phase 3: `config plan` reports the activation inventory without starting
# anything (dry run over the resolved model).
[[e2e.scenarios]]
name = "plan-reports-activation-inventory"
argv = ["config", "plan", "--config", "/dev/stdin"]
stdin = '''
schema_version = 1
[listener.web]
listen = "127.0.0.1:8080"
mode = "http"
backend = "api"
[backend.api]
servers = [{ addr = "127.0.0.1:9000", weight = 3 }]
'''
expect_exit = 0
expect_stdout_regex = "plan: 1 listener\\(s\\), 1 backend\\(s\\) — nothing started \\(dry run\\)"

# Phase 3: `config explain` simulates one routing decision offline with no
# side effects and reports listener, backend and selected server.
[[e2e.scenarios]]
name = "explain-simulates-routing-without-side-effects"
argv = ["config", "explain", "--config", "/dev/stdin"]
stdin = '''
schema_version = 1
[listener.web]
listen = "127.0.0.1:8080"
mode = "http"
backend = "api"
[backend.api]
servers = [{ addr = "127.0.0.1:9000", weight = 3 }]
'''
expect_exit = 0
expect_stdout_regex = "simulation: true \\(no requests issued, no state changed\\)"

# Phase 2b: weighted servers and health check are accepted and summarized.
[[e2e.scenarios]]
name = "validate-accepts-servers-weights-and-health-check"
argv = ["config", "validate", "--config", "/dev/stdin"]
stdin = '''
schema_version = 1
[listener.web]
listen = "127.0.0.1:8080"
backend = "api"
[backend.api]
servers = [{ addr = "127.0.0.1:9000", weight = 3 }, { addr = "127.0.0.1:9001" }]
balance = "roundrobin"
proxy_protocol = "v1"
[backend.api.health_check]
interval = "2s"
timeout = "1s"
fall = 3
rise = 2
'''
expect_exit = 0
expect_stdout_regex = "config OK: 1 listener\\(s\\), 1 backend\\(s\\)"

# `server` and `servers` are mutually exclusive: actionable error with the field.
[[e2e.scenarios]]
name = "validate-rejects-server-and-servers"
argv = ["config", "validate", "--config", "/dev/stdin"]
stdin = '''
schema_version = 1
[backend.api]
server = "127.0.0.1:9000"
servers = [{ addr = "127.0.0.1:9001" }]
'''
expect_failure = true
expect_exit = 1
expect_stderr_regex = "backend.api.servers.*mutually exclusive"

# Out-of-range weight (HAProxy: 0..=256) → error with range and example.
[[e2e.scenarios]]
name = "validate-rejects-out-of-range-weight"
argv = ["config", "validate", "--config", "/dev/stdin"]
stdin = '''
schema_version = 1
[backend.api]
servers = [{ addr = "127.0.0.1:9000", weight = 257 }]
'''
expect_failure = true
expect_exit = 1
expect_stderr_regex = "weight = 257 out of range"

# Duplicate ALPN (A14): the list must be a set.
[[e2e.scenarios]]
name = "validate-rejects-duplicate-alpn"
argv = ["config", "validate", "--config", "/dev/stdin"]
stdin = '''
schema_version = 1
[listener.web]
listen = "127.0.0.1:8080"
backend = "api"
[listener.web.tls]
cert = "c.pem"
key = "k.pem"
alpn = ["http/1.1", "http/1.1"]
[backend.api]
server = "127.0.0.1:9000"
'''
expect_failure = true
expect_exit = 1
expect_stderr_regex = "duplicate ALPN"

# Health check with 0 thresholds: invalid (fall/rise ≥ 1).
[[e2e.scenarios]]
name = "validate-rejects-zero-health-check"
argv = ["config", "validate", "--config", "/dev/stdin"]
stdin = '''
schema_version = 1
[backend.api]
server = "127.0.0.1:9000"
[backend.api.health_check]
fall = 0
rise = 0
'''
expect_failure = true
expect_exit = 1
expect_stderr_regex = "health_check.fall must be at least 1"

# Mutants scoped to the critical configuration logic (resource
# budget, semantic validation and actionable errors). A glob with no
# mutants would be a false OK: the path prefixes belong to the workspace.
[mutants]
paths = [
    "eqproxy-config/src/validate.rs",
    "eqproxy-config/src/lib.rs",
    "eqproxy-config/src/schema.rs",
]
timeout_seconds = 120
