name: Release

# Pushing a `v*` tag runs the full release pipeline in this file: every
# artifact is E2E-verified (real CLI journeys and live proxied traffic)
# BEFORE any checksum, release asset or registry push exists. A failing
# verification fails the workflow and nothing is published.
#
# The pipeline is self-contained here (owner decision 2026-10-19: the
# scripts/ folder is maintainer-local and never published; this file
# absorbed scripts/release.sh). The version pin is the workspace version
# in Cargo.toml — on a tag run the tag must match it exactly.
#
# A manual run (workflow_dispatch) exercises the whole pipeline as a dry
# run: release creation and registry push are gated on `ref_type == tag`,
# so a branch run can never publish anything.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: Tag matches the workspace version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check version pin
        if: github.ref_type == 'tag'
        run: |
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "tag=$GITHUB_REF_NAME workspace version=$VER"
          test "v$VER" = "$GITHUB_REF_NAME" \
            || { echo "tag $GITHUB_REF_NAME does not match the workspace version $VER in Cargo.toml"; exit 1; }

  darwin:
    name: Binaries darwin (build + E2E verify)
    needs: guard
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust targets
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Allow loopback services (macOS firewall drops unsigned listeners)
        run: |
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --getglobalstate
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off

      - name: Build darwin binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p eqproxy-cli --target "$target"
          done
          cp target/aarch64-apple-darwin/release/eqproxy dist/eqproxy-darwin-arm64
          cp target/x86_64-apple-darwin/release/eqproxy dist/eqproxy-darwin-amd64

      # Per-binary E2E verification (real behavior, observable results):
      # validate, explain, diff, apply/rollback, doctor and live proxied
      # traffic — never a smoke test.
      - name: E2E-verify darwin binaries
        run: |
          set -euo pipefail
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          GOOD_CONFIG='schema_version = 1
          [listener.web]
          listen = "127.0.0.1:0"
          backend = "api"
          [backend.api]
          server = "127.0.0.1:9"
          '
          fail() { printf 'release FAILED: %s\n' "$*" >&2; exit 1; }
          log() { printf '==> %s\n' "$*"; }
          verify_cli() {
            local bin="$1"
            log "E2E $bin: --version"
            "$bin" --version | grep -q "eqproxy $VER" || fail "$bin reports wrong version"
            log "E2E $bin: validate accepts good config"
            printf '%s' "$GOOD_CONFIG" | "$bin" config validate --config /dev/stdin \
              | grep -q "config OK: 1 listener(s), 1 backend(s)" \
              || fail "$bin validate happy path"
            log "E2E $bin: validate rejects missing file with exit 1"
            if "$bin" config validate --config /nonexistent-e2e.toml 2>/tmp/e2e-err.txt; then
              fail "$bin accepted a missing file"
            fi
            grep -q "could not read the file" /tmp/e2e-err.txt \
              || fail "$bin missing-file error not actionable"
            log "E2E $bin: explain simulates without side effects"
            printf '%s' "$GOOD_CONFIG" | "$bin" config explain --config /dev/stdin \
              | grep -q "simulation: true (no requests issued, no state changed)" \
              || fail "$bin explain report"
            log "E2E $bin: diff finds no differences on identical input"
            printf '%s' "$GOOD_CONFIG" > /tmp/e2e-left.toml
            cp /tmp/e2e-left.toml /tmp/e2e-right.toml
            "$bin" config diff /tmp/e2e-left.toml /tmp/e2e-right.toml 2>/dev/null \
              | grep -q "no differences" || fail "$bin diff identical"
            log "E2E $bin: apply stores offline and rollback walks back"
            export EQPROXY_STATE_DIR
            EQPROXY_STATE_DIR="$(mktemp -d /tmp/e2e-state-XXXXXX)"
            printf '%s' "$GOOD_CONFIG" > /tmp/e2e-cand.toml
            "$bin" config apply --config /tmp/e2e-cand.toml > /tmp/e2e-apply.txt \
              || fail "$bin apply first failed"
            grep -q "no previous configuration" /tmp/e2e-apply.txt \
              || fail "$bin apply first"
            "$bin" config apply --config /tmp/e2e-cand.toml > /tmp/e2e-apply.txt \
              || fail "$bin apply idempotent failed"
            grep -q "already applied" /tmp/e2e-apply.txt \
              || fail "$bin apply idempotent"
            log "E2E $bin: doctor passes pre-flight on a free port"
            "$bin" doctor --config /tmp/e2e-cand.toml > /tmp/e2e-doctor.txt \
              || fail "$bin doctor failed"
            grep -q "doctor: PASS" /tmp/e2e-doctor.txt \
              || fail "$bin doctor verdict"
            grep -q "ok: bind" /tmp/e2e-doctor.txt \
              || fail "$bin doctor bind probe"
            if "$bin" config rollback 2>/tmp/e2e-err.txt; then
              fail "$bin rollback with empty history succeeded"
            fi
            grep -q "no previous configuration" /tmp/e2e-err.txt \
              || fail "$bin rollback empty not explicit"
            rm -rf "$EQPROXY_STATE_DIR"
            unset EQPROXY_STATE_DIR
          }
          wait_for_port() {
            local port="$1" label="$2" i
            for i in $(seq 1 50); do
              if python3 -c "import socket,sys; socket.create_connection(('127.0.0.1',$port),timeout=1).close()" 2>/dev/null; then
                return 0
              fi
              sleep 0.2
            done
            # Logs on timeout, as promised: a silent 60s wait in CI is undiagnosable.
            {
              echo "--- diagnostics: $label on 127.0.0.1:$port ---"
              python3 --version 2>&1
              echo "connect_ex (0 ok / 61 refused / 60 timeout): $(python3 -c "import socket; s=socket.socket(); s.settimeout(2); print(s.connect_ex(('127.0.0.1',$port)))" 2>&1)"
              lsof -nP -iTCP:$port 2>&1 || true
              echo "--- /tmp/e2e-backend.log ---"
              cat /tmp/e2e-backend.log 2>&1 || true
            } >&2
            fail "$label never listened on 127.0.0.1:$port"
          }
          verify_live_native() {
            local bin="$1"
            local port backend_port
            read -r port backend_port <<< "$(python3 -c "import socket
          a=socket.socket(); a.bind(('127.0.0.1',0)); p1=a.getsockname()[1]; a.close()
          b=socket.socket(); b.bind(('127.0.0.1',0)); p2=b.getsockname()[1]; b.close()
          print(p1,p2)")"
            log "E2E $bin: live proxied traffic on 127.0.0.1:$port"
            # Raw-socket test backend. NOT python3 -m http.server: since
            # CPython 3.13 the CLI resolves socket.getfqdn() between bind()
            # and listen(), and that reverse DNS blocks for minutes on
            # runners with a slow PTR resolver. No name resolution here.
            python3 -c "
          import socket
          body = b'hello-release-e2e\n'
          resp = (b'HTTP/1.1 200 OK\r\nContent-Length: ' + str(len(body)).encode()
                  + b'\r\nConnection: close\r\n\r\n' + body)
          s = socket.socket()
          s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          s.bind(('127.0.0.1', $backend_port))
          s.listen(16)
          print('listening', flush=True)
          while True:
              c, _ = s.accept()
              try:
                  c.recv(65536)
                  c.sendall(resp)
              finally:
                  c.close()
          " >/tmp/e2e-backend.log 2>&1 &
            local backend_pid=$!
            wait_for_port "$backend_port" "backend"
            cat > /tmp/e2e-proxy.toml <<EOF
          schema_version = 1
          [listener.web]
          listen = "127.0.0.1:$port"
          mode = "http"
          backend = "api"
          [backend.api]
          server = "127.0.0.1:$backend_port"
          EOF
            "$bin" run --config /tmp/e2e-proxy.toml >/tmp/e2e-proxy.log 2>&1 &
            local proxy_pid=$!
            wait_for_port "$port" "proxy $bin"
            local body
            body="$(curl -s "http://127.0.0.1:$port/")" \
              || fail "$bin live traffic: curl failed"
            kill "$proxy_pid" "$backend_pid" 2>/dev/null || true
            [ "$body" = "hello-release-e2e" ] \
              || fail "$bin live traffic mismatch: $body"
            log "E2E $bin: live traffic OK"
          }
          verify_cli dist/eqproxy-darwin-arm64
          verify_live_native dist/eqproxy-darwin-arm64
          log "verifying darwin-amd64 (Rosetta)"
          arch -x86_64 true 2>/dev/null \
            || fail "Rosetta missing: darwin-amd64 NOT EXECUTED is not acceptable for release"
          verify_cli dist/eqproxy-darwin-amd64
          verify_live_native dist/eqproxy-darwin-amd64

      - uses: actions/upload-artifact@v7
        with:
          name: dist-darwin
          path: dist/eqproxy-darwin-*
          if-no-files-found: error

  linux:
    name: Binaries linux (build + E2E verify) + SBOM
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build linux binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --file docker/Dockerfile \
              --target export --output "type=local,dest=dist/linux-$arch-tmp" .
            mv "dist/linux-$arch-tmp/eqproxy" "dist/eqproxy-linux-$arch"
            rm -rf "dist/linux-$arch-tmp"
          done

      - name: E2E-verify linux binaries
        run: |
          set -euo pipefail
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          GOOD_CONFIG='schema_version = 1
          [listener.web]
          listen = "127.0.0.1:0"
          backend = "api"
          [backend.api]
          server = "127.0.0.1:9"
          '
          fail() { printf 'release FAILED: %s\n' "$*" >&2; exit 1; }
          log() { printf '==> %s\n' "$*"; }
          # Live proxied traffic through a container on a static-IP docker
          # network (backend nginx: dynamic DNS is Phase 4, B16, so
          # hostnames stay rejected).
          verify_live_container() {
            local verdict="$1" proxy_image="$2"; shift 2
            local net="eqrel-net"
            log "E2E $proxy_image: live proxied traffic ($verdict)"
            docker network create --subnet 172.22.0.0/24 "$net" >/dev/null
            docker run -d --network "$net" --ip 172.22.0.10 --name eqrel-back \
              nginx:alpine >/dev/null
            sleep 2
            cat > /tmp/e2e-proxy.toml <<'EOF'
          schema_version = 1
          [listener.web]
          listen = "0.0.0.0:18082"
          mode = "http"
          backend = "api"
          [backend.api]
          server = "172.22.0.10:80"
          EOF
            docker run -d --network "$net" --ip 172.22.0.20 --name eqrel-prox \
              -p 18082:18082 "$@" \
              -v /tmp/e2e-proxy.toml:/c.toml:ro \
              "$proxy_image" run --config /c.toml >/dev/null
            sleep 4
            local code
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18082/)"
            docker rm -f eqrel-prox eqrel-back >/dev/null
            docker network rm "$net" >/dev/null
            [ "$code" = "200" ] || fail "$proxy_image live traffic HTTP $code ($verdict)"
            log "E2E $proxy_image: live traffic OK ($verdict)"
          }
          for arch in arm64 amd64; do
            bin="dist/eqproxy-linux-$arch"
            log "verifying linux-$arch (container)"
            docker run --rm --platform "linux/$arch" \
              -v "$PWD/dist:/d:ro" -v /tmp:/tmp \
              --entrypoint /bin/bash debian:bookworm-slim -c "
                set -e
                /d/eqproxy-linux-$arch --version | grep -q 'eqproxy $VER'
                printf '%s' '$GOOD_CONFIG' | /d/eqproxy-linux-$arch config validate --config /dev/stdin | grep -q 'config OK'
              " || fail "$bin container CLI verification"
            verify_live_container "linux/$arch, $bin" debian:bookworm-slim \
              --platform "linux/$arch" -v "$PWD/dist:/d:ro" --entrypoint /d/eqproxy-linux-$arch
          done

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Regenerate SBOM
        run: |
          set -euo pipefail
          mkdir -p sbom
          cargo cyclonedx --all --format json
          for crate in eqproxy-core eqproxy-config eqproxy-net eqproxy-cli; do
            mv "$crate/$crate.cdx.json" "sbom/$crate.cdx.json"
          done
          # Machine layout must never ship: strip the absolute build path
          # from the `path+file://` bom-refs (audit 2026-10-16: /Volumes/...
          # in published SBOMs). Portable sed (-i.bak works on BSD and GNU),
          # then drop the backups.
          sed -i.bak -E 's|path[+]file://[^"#]*/(eqproxy-[^"/#]+)|path+file://\1|g' \
            sbom/*.cdx.json
          rm -f sbom/*.cdx.json.bak
          if grep -q -F 'path+file:///' sbom/*.cdx.json; then
            echo "SBOM still contains absolute paths after sanitization"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux
          path: dist/eqproxy-linux-*
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/*.cdx.json
          if-no-files-found: error

  release:
    name: GitHub release (binaries + SHA256SUMS + SBOM + Scout)
    # The image job is a prerequisite, not a sibling: the release must not
    # exist until both architecture images have been scanned by Docker Scout
    # and exercised end to end. A failing scan or E2E leaves the tag without
    # a release instead of shipping one next to an unverified image.
    needs: [darwin, linux, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: collect

      - name: Assemble dist/ and write SHA256SUMS (only after both builds verified)
        run: |
          set -euo pipefail
          mkdir -p dist sbom scout
          find collect -type f \( -name 'eqproxy-darwin-*' -o -name 'eqproxy-linux-*' \) -exec cp {} dist/ \;
          find collect -type f -name '*.cdx.json' -exec cp {} sbom/ \;
          find collect -type f -name 'SCOUT-*.md' -exec cp {} scout/ \;
          # Both architectures must have been scanned; a missing report means
          # the gate did not run and the release must not be created.
          for arch in amd64 arm64; do
            ls scout/SCOUT-*-linux-"$arch".md >/dev/null 2>&1 \
              || { echo "missing Scout report for linux/$arch"; exit 1; }
          done
          for bin in eqproxy-darwin-amd64 eqproxy-darwin-arm64 eqproxy-linux-amd64 eqproxy-linux-arm64; do
            test -f "dist/$bin" || { echo "missing $bin in dist/ (builds did not produce it)"; exit 1; }
          done
          echo "==> writing SHA256SUMS (only after every artifact passed)"
          (cd dist && if command -v sha256sum >/dev/null 2>&1; then
            sha256sum eqproxy-darwin-amd64 eqproxy-darwin-arm64 \
              eqproxy-linux-amd64 eqproxy-linux-arm64 > SHA256SUMS.txt
          else
            shasum -a 256 eqproxy-darwin-amd64 eqproxy-darwin-arm64 \
              eqproxy-linux-amd64 eqproxy-linux-arm64 > SHA256SUMS.txt
          fi)
          cat dist/SHA256SUMS.txt

      - name: Create or refresh GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Prerelease tags (a `-` suffix) publish as GitHub prereleases.
          EXTRA=""
          case "$GITHUB_REF_NAME" in *-*) EXTRA="--prerelease" ;; esac
          # Idempotent on purpose: if a sibling job fails (e.g. the image push
          # to a registry) the tag is re-run, and the release must refresh its
          # assets instead of failing on "release already exists".
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* sbom/*.cdx.json scout/*.md --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md $EXTRA
          else
            gh release create "$GITHUB_REF_NAME" dist/* sbom/*.cdx.json scout/*.md \
              --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md $EXTRA
          fi

  image:
    name: Multi-arch image (build + Scout both archs + E2E + promote)
    needs: [darwin, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publish gate (owner decision 2026-10-20, extended the same day to
      # **both** architectures): the image is built once and pushed under a
      # throwaway `-candidate` tag, so Docker Scout inspects the exact
      # manifest digests that get published — on linux/amd64 **and**
      # linux/arm64. `$VERSION` and `:latest` are only created afterwards by
      # promoting that same index by digest, and the release job waits for
      # this job, so no architecture can ship unscanned and no finding can
      # reach a tag anyone pulls. The candidate tag is never documented nor
      # pointed by `:latest`; it is the record of what was scanned.
      # --pull: the base digest recorded in the image must be the current
      # one, or Docker Scout's "no outdated base images" policy flags a
      # release built from a tag that moved after the local cache.
      - name: Build and push the candidate manifest (linux/amd64 + linux/arm64)
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          docker buildx build --pull --file docker/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --provenance=mode=max --sbom=true \
            --tag "ghcr.io/exyonq/eqproxy:${VERSION}-candidate" --push .

      - name: Record the candidate index digest
        if: github.ref_type == 'tag'
        id: candidate
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          REF="ghcr.io/exyonq/eqproxy:${VERSION}-candidate"
          # The digest of the index bytes is the digest `imagetools create`
          # promotes and the one the post-promotion check compares against.
          DIGEST=$(docker buildx imagetools inspect --raw "$REF" | sha256sum | cut -d' ' -f1)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "candidate index: $REF@sha256:$DIGEST"

      # Scout needs an authenticated Docker Hub account to index the image.
      # Same secrets as the mirror step below; the gate only exists on the
      # path that can actually publish.
      - name: Log in to Docker Hub (Scout indexing and mirror)
        if: github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The runtime is `scratch`, so a finding here means a real regression in
      # what we ship, not noise from a Debian base. The CLI is pinned:
      # `docker scout cves --exit-code` is the command verified locally on the
      # release image (exit 0), not the action's `compare` semantics.
      - name: Install Docker Scout CLI (pinned)
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh \
            | sh -s -- v1.25.0
          docker scout version

      - name: Docker Scout gate (linux/amd64 and linux/arm64, critical/high = 0)
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          REF="ghcr.io/exyonq/eqproxy:${VERSION}-candidate"
          DIGEST="${{ steps.candidate.outputs.digest }}"
          mkdir -p scout
          for arch in amd64 arm64; do
            report="scout/SCOUT-${VERSION}-linux-${arch}.md"
            {
              echo "# Docker Scout — \`$REF\` \`linux/$arch\`"
              echo
              echo "Scanned candidate index: \`sha256:${DIGEST}\`"
              echo
              echo "Command: \`docker scout cves --format markdown --platform linux/$arch $REF\`"
              echo
            } > "$report"
            docker scout cves --format markdown --platform "linux/$arch" "$REF" \
              >> "$report"
            # Same report data, exit code 2 on any critical/high: pipefail keeps
            # Scout's status through `tail` instead of masking it.
            set -o pipefail
            docker scout cves --only-severity critical,high --exit-code \
              --platform "linux/$arch" "$REF" | tail -12
            echo "scout: no critical or high vulnerability on linux/$arch"
          done

      - name: Verify image artifact on both architectures (version + config gate + live traffic)
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          GOOD_CONFIG='schema_version = 1
          [listener.web]
          listen = "127.0.0.1:0"
          backend = "api"
          [backend.api]
          server = "127.0.0.1:9"
          '
          fail() { printf 'release FAILED: %s\n' "$*" >&2; exit 1; }
          log() { printf '==> %s\n' "$*"; }
          verify_live_container() {
            local verdict="$1" proxy_image="$2"; shift 2
            local net="eqrel-net"
            log "E2E $proxy_image: live proxied traffic ($verdict)"
            docker network create --subnet 172.22.0.0/24 "$net" >/dev/null
            docker run -d --network "$net" --ip 172.22.0.10 --name eqrel-back \
              nginx:alpine >/dev/null
            sleep 2
            cat > /tmp/e2e-proxy.toml <<'EOF'
          schema_version = 1
          [listener.web]
          listen = "0.0.0.0:18082"
          mode = "http"
          backend = "api"
          [backend.api]
          server = "172.22.0.10:80"
          EOF
            docker run -d --network "$net" --ip 172.22.0.20 --name eqrel-prox \
              -p 18082:18082 "$@" \
              -v /tmp/e2e-proxy.toml:/c.toml:ro \
              "$proxy_image" run --config /c.toml >/dev/null
            sleep 4
            local code
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18082/)"
            docker rm -f eqrel-prox eqrel-back >/dev/null
            docker network rm "$net" >/dev/null
            [ "$code" = "200" ] || fail "$proxy_image live traffic HTTP $code ($verdict)"
            log "E2E $proxy_image: live traffic OK ($verdict)"
          }
          VERSION="${GITHUB_REF_NAME#v}"
          image="ghcr.io/exyonq/eqproxy:${VERSION}-candidate"
          for arch in amd64 arm64; do
            log "E2E $image (linux/$arch): --version"
            docker run --rm --platform "linux/$arch" "$image" --version \
              | grep -q "eqproxy $VER" \
              || fail "$image linux/$arch reports wrong version"
            log "E2E $image (linux/$arch): validate accepts good config"
            printf '%s' "$GOOD_CONFIG" | docker run --rm -i --platform "linux/$arch" "$image" \
              config validate --config /dev/stdin \
              | grep -q "config OK: 1 listener(s), 1 backend(s)" \
              || fail "$image linux/$arch validate happy path"
            # The gate must reject ALPN h2 on an HTTP listener: it used to
            # negotiate a protocol the dataplane cannot serve.
            log "E2E $image (linux/$arch): validate rejects alpn = [\"h2\"]"
            cat > /tmp/e2e-h2.toml <<'EOF'
          schema_version = 1
          [listener.web]
          listen = "127.0.0.1:0"
          mode = "http"
          backend = "api"
          [listener.web.tls]
          cert = "c.pem"
          key = "k.pem"
          alpn = ["h2"]
          [backend.api]
          server = "127.0.0.1:9"
          EOF
            set +e
            h2_out="$(docker run --rm --platform "linux/$arch" \
              -v /tmp/e2e-h2.toml:/h2.toml:ro "$image" \
              config validate --config /h2.toml 2>&1)"
            h2_status=$?
            set -e
            [ "$h2_status" = "1" ] \
              || fail "$image linux/$arch accepted alpn = [\"h2\"] (exit $h2_status)"
            # `case` instead of `printf | grep -q`: grep exits on the first
            # match and the writer can take SIGPIPE, which `pipefail` turns
            # into a failed step even when the check matched.
            case "$h2_out" in
              *'ALPN protocol "h2" cannot be served'*) ;;
              *) fail "$image linux/$arch h2 rejection lacks the cause: $h2_out" ;;
            esac
            case "$h2_out" in
              *'alpn = ["http/1.1"]'*) ;;
              *) fail "$image linux/$arch h2 rejection lacks the fix: $h2_out" ;;
            esac
            # config apply used to fail with "Permission denied" because the
            # state directory resolved to / under this unprivileged image.
            log "E2E $image (linux/$arch): config apply writes state"
            cat > /tmp/e2e-apply.toml <<'EOF'
          schema_version = 1
          [listener.web]
          listen = "127.0.0.1:0"
          backend = "api"
          [backend.api]
          server = "127.0.0.1:9"
          EOF
            # Capture the output instead of piping into `grep -q`: apply
            # keeps printing the plan after "applied:", grep closes the pipe
            # on its first match and `pipefail` then fails the step.
            apply_out="$(docker run --rm --platform "linux/$arch" \
              -v /tmp/e2e-apply.toml:/c.toml:ro "$image" \
              config apply --config /c.toml)" \
              || fail "$image linux/$arch config apply"
            case "$apply_out" in
              *applied:*) ;;
              *) fail "$image linux/$arch config apply printed: $apply_out" ;;
            esac
            verify_live_container "image artifact, linux/$arch" "$image" \
              --platform "linux/$arch"
          done

      - uses: actions/upload-artifact@v7
        if: github.ref_type == 'tag'
        with:
          name: scout-reports
          path: scout/SCOUT-*.md
          if-no-files-found: error

      # Promotion by digest: the tags point at the exact index Scout scanned
      # and the E2E journeys ran on. No rebuild happens here, so what was
      # verified is what gets pulled.
      - name: Promote the scanned digest to the release tags
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          INDEX="${{ steps.candidate.outputs.digest }}"
          # `:latest` only tracks final releases: a prerelease tag (with a
          # `-` suffix) never re-points it.
          TAGS="--tag ghcr.io/exyonq/eqproxy:$VERSION"
          case "$VERSION" in *-*) ;; *) TAGS="$TAGS --tag ghcr.io/exyonq/eqproxy:latest" ;; esac
          docker buildx imagetools create $TAGS "ghcr.io/exyonq/eqproxy@sha256:$INDEX"

      # Mirror the exact verified manifest (same digests) to Docker Hub.
      # Secrets DOCKERHUB_USERNAME/DOCKERHUB_TOKEN come from the maintainer's
      # Hub access token (never stored in the repository).
      - name: Mirror the verified manifest to Docker Hub
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          INDEX="${{ steps.candidate.outputs.digest }}"
          TAGS="--tag exyonq/eqproxy:$VERSION"
          case "$VERSION" in *-*) ;; *) TAGS="$TAGS --tag exyonq/eqproxy:latest" ;; esac
          docker buildx imagetools create $TAGS "ghcr.io/exyonq/eqproxy@sha256:$INDEX"

      # The published tags must be the scanned index on both registries —
      # otherwise "Scout says 0C/0H" would be a claim about different bytes.
      - name: Verify the published tags carry the scanned digest
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          INDEX="${{ steps.candidate.outputs.digest }}"
          REFS="ghcr.io/exyonq/eqproxy:$VERSION exyonq/eqproxy:$VERSION ghcr.io/exyonq/eqproxy:${VERSION}-candidate"
          case "$VERSION" in *-*) ;; *) REFS="$REFS ghcr.io/exyonq/eqproxy:latest exyonq/eqproxy:latest" ;; esac
          for ref in $REFS; do
            got=$(docker buildx imagetools inspect --raw "$ref" | sha256sum | cut -d' ' -f1)
            [ "$got" = "$INDEX" ] \
              || { echo "$ref points at sha256:$got, not the scanned sha256:$INDEX"; exit 1; }
            echo "$ref -> sha256:$INDEX (scanned)"
          done
          docker buildx imagetools inspect "ghcr.io/exyonq/eqproxy:$VERSION"

      # What the candidate E2E proved is the bytes before promotion. This
      # replays the same journeys on the image a user actually pulls, from
      # both registries and on both architectures: a tag that resolves to the
      # scanned digest is not proof that the published image runs.
      - name: Re-pull the published image and replay the journeys (2 registries × 2 architectures)
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          INDEX="${{ steps.candidate.outputs.digest }}"
          fail() { printf 'release FAILED: %s\n' "$*" >&2; exit 1; }
          log() { printf '==> %s\n' "$*"; }
          cat > /tmp/published-h2.toml <<'EOF'
          schema_version = 1
          [listener.web]
          listen = "127.0.0.1:0"
          mode = "http"
          backend = "api"
          [listener.web.tls]
          cert = "c.pem"
          key = "k.pem"
          alpn = ["h2"]
          [backend.api]
          server = "127.0.0.1:9"
          EOF
          cat > /tmp/published-apply.toml <<'EOF'
          schema_version = 1
          [listener.web]
          listen = "127.0.0.1:0"
          backend = "api"
          [backend.api]
          server = "127.0.0.1:9"
          EOF
          verify_published() {
            local ref="$1" arch="$2" net="$3" subnet="$4"
            log "re-pull $ref (linux/$arch)"
            docker pull -q --platform "linux/$arch" "$ref" >/dev/null \
              || fail "docker pull $ref linux/$arch"
            case "$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$ref")" in
              *"@sha256:$INDEX"*) ;;
              *) fail "$ref linux/$arch is not the scanned index sha256:$INDEX" ;;
            esac
            docker run --rm --platform "linux/$arch" "$ref" --version \
              | grep -q "eqproxy $VERSION" \
              || fail "$ref linux/$arch reports the wrong version"
            set +e
            h2_out="$(docker run --rm --platform "linux/$arch" \
              -v /tmp/published-h2.toml:/h2.toml:ro "$ref" \
              config validate --config /h2.toml 2>&1)"
            h2_status=$?
            set -e
            [ "$h2_status" = "1" ] \
              || fail "$ref linux/$arch accepted alpn = [\"h2\"] (exit $h2_status)"
            case "$h2_out" in
              *'ALPN protocol "h2" cannot be served'*) ;;
              *) fail "$ref linux/$arch h2 rejection lacks the cause: $h2_out" ;;
            esac
            apply_out="$(docker run --rm --platform "linux/$arch" \
              -v /tmp/published-apply.toml:/c.toml:ro "$ref" \
              config apply --config /c.toml)" \
              || fail "$ref linux/$arch config apply"
            case "$apply_out" in
              *applied:*) ;;
              *) fail "$ref linux/$arch config apply printed: $apply_out" ;;
            esac
            log "re-pull $ref (linux/$arch): live proxied traffic"
            docker network create --subnet "$subnet" "$net" >/dev/null
            docker run -d --network "$net" --ip "${subnet%.0/24}.10" --name "$net-back" \
              nginx:alpine >/dev/null
            sleep 2
            cat > /tmp/published-live.toml <<LIVE
          schema_version = 1
          [listener.web]
          listen = "0.0.0.0:18084"
          mode = "http"
          backend = "api"
          [backend.api]
          server = "${subnet%.0/24}.10:80"
          LIVE
            docker run -d --network "$net" --ip "${subnet%.0/24}.20" --name "$net-prox" \
              -p 18084:18084 --platform "linux/$arch" \
              -v /tmp/published-live.toml:/c.toml:ro "$ref" run --config /c.toml >/dev/null
            sleep 4
            local code
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18084/)"
            docker rm -f "$net-prox" "$net-back" >/dev/null
            docker network rm "$net" >/dev/null
            [ "$code" = "200" ] || fail "$ref linux/$arch live traffic HTTP $code"
            log "published $ref linux/$arch: version, digest, h2 gate, config apply and live traffic OK"
          }
          i=0
          for ref in "ghcr.io/exyonq/eqproxy:$VERSION" "exyonq/eqproxy:$VERSION"; do
            for arch in amd64 arm64; do
              i=$((i + 1))
              verify_published "$ref" "$arch" "eqpub-$i" "172.23.$i.0/24"
            done
          done

      - name: Build multi-arch image (dry run, no push)
        if: github.ref_type != 'tag'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          TAGS="--tag ghcr.io/exyonq/eqproxy:$VERSION"
          case "$VERSION" in *-*) ;; *) TAGS="$TAGS --tag ghcr.io/exyonq/eqproxy:latest" ;; esac
          docker buildx build --pull --file docker/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --provenance=mode=max --sbom=true \
            $TAGS .
          # A dry run publishes nothing, but the image must still be shown to
          # work: load the native build and run it (Scout and the arm64 E2E
          # need a registry reference, so they stay tag-only).
          docker buildx build --pull --file docker/Dockerfile --platform linux/amd64 \
            --tag eqproxy-dryrun:ci --load .
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          docker run --rm eqproxy-dryrun:ci --version | grep -q "eqproxy $VER" \
            || { echo "dry-run image reports the wrong version"; exit 1; }
          echo "dry-run image: eqproxy $VER"
