name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-tier1:
    name: Linux x86_64 (tier-1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain is pinned in rust-toolchain.toml, not `stable`: a new
      # stable must arrive as a deliberate bump with its evidence, never as a
      # surprise lint or formatting failure in this job. The step reads the
      # file, so the pin stays the single source.
      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy

      # The release image is built by docker/Dockerfile, whose builder stage
      # names its own Rust version in ARG RUST_VERSION. Two pins that can
      # drift are not a pin, so this gate fails when they disagree.
      - name: Docker builder matches the toolchain pin
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          builder=$(sed -n 's/^ARG RUST_VERSION=\(.*\)$/\1/p' docker/Dockerfile)
          test "$channel" = "$builder" \
            || { echo "rust-toolchain.toml pins $channel but docker/Dockerfile builds with $builder"; exit 1; }

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The log is kept, with `--nocapture` so a uid-gated skip's `eprintln!`
      # is in it instead of being swallowed for a passing test, because the
      # step below reads it: this run is unprivileged, so it must print none
      # of those markers. The root side is `suite-as-root`.
      - name: Tests (unprivileged user)
        run: |
          set -euo pipefail
          cargo test --workspace -- --nocapture 2>&1 | tee /tmp/suite-user.log

      - name: UID-gated skips are declared (unprivileged run)
        run: |
          set -euo pipefail
          python3 .github/scripts/check-uid-skips.py --user-log /tmp/suite-user.log

  # The same suite, as uid 0. Two blocks of it only hold for an unprivileged
  # uid: each asserts that a `chown(2)` to a foreign group is refused, and root
  # is allowed to perform it. Run as root they print a declared
  # `SKIP (running as root): <reason>` line and carry on, instead of failing
  # on a premise that is absent — and instead of hanging on a line that can
  # never arrive, which is what cli_e2e did before its declaration (it waited
  # in `read_line`; a 90 s guard ended the run, 2026-10-27).
  # check-uid-skips.py refuses a skip that is not declared in
  # .github/scripts/uid-skips.txt, one whose count moved, and a declaration
  # that stopped printing; the step timeout turns a hang into a red build
  # instead of a squatting job. Build and registry live under /tmp so the root
  # processes write into nothing the other jobs' cache steps save.
  suite-as-root:
    name: Suite as root (uid-gated skips declared)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal

      - name: Tests as root (uid 0)
        timeout-minutes: 20
        run: |
          set -euo pipefail
          sudo env \
            PATH="$PATH" \
            RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" \
            CARGO_HOME=/tmp/eqproxy-root-cargo \
            CARGO_TARGET_DIR=/tmp/eqproxy-root-target \
            cargo test --workspace -- --nocapture 2>&1 | tee /tmp/suite-root.log

      - name: UID-gated skips are declared (root run)
        run: |
          set -euo pipefail
          python3 .github/scripts/check-uid-skips.py --root-log /tmp/suite-root.log

  # The evidence documents are part of the published repository and of the
  # source tarball, so a test citation that points at nothing ships with the
  # release. This gate reads the Rust tree of the same commit and refuses a
  # citation of a test-shaped identifier that the tree does not define; the
  # self-test first proves the detector itself still detects. Historical names
  # are declared, with their reason, in
  # .github/scripts/evidence-test-citations-allow.txt.
  evidence-test-citations:
    name: Evidence test citations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Self-test the citation detector
        run: python3 .github/scripts/check-evidence-test-citations.py --self-test

      - name: Check docs/evidence test citations
        run: python3 .github/scripts/check-evidence-test-citations.py

  # Admin plane (v0.8, B-H14; ADR-0022/ADR-0023) on **native** runners.
  #
  # The release gate (.github/workflows/release.yml) runs this same journey
  # against the bytes of the scanned image, but its arm64 leg runs under QEMU
  # on an amd64 runner. Here each leg builds the binary for the runner's own
  # architecture and runs it on that architecture: `ubuntu-24.04-arm` is a
  # real arm64 host (free for public repositories), so nothing about the
  # kernel-level contract — POSIX ACL support on the filesystem, connect(2)
  # enforcement, SO_PEERCRED, getdents on /proc/<pid>/fd — can be masked by a
  # syscall translator, and neither leg pays QEMU's translation cost.
  #
  # The journey is the published one (.github/scripts/admin-unix-acl-e2e.sh),
  # the very file the release job mounts: one source, so a PR cannot be green
  # on a journey the release does not actually run. The step below asserts the
  # runner's own architecture before invoking the journey, so a leg that
  # silently fell back to emulation fails instead of passing slowly.
  admin-unix-acl:
    name: Admin socket ACL E2E (native ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            machine: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Same pin as the tier-1 job: the journey must everywhere be built by
      # one compiler, on both runner architectures.
      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build the binary for this runner
        run: cargo build --release --locked -p eqproxy-cli

      - name: Admin socket ACL E2E (B-H14)
        run: |
          set -euo pipefail
          test -x target/release/eqproxy
          host_machine="$(uname -m)"
          if [ "$host_machine" != "${{ matrix.machine }}" ]; then
            printf 'FAIL declared %s but the runner is %s: not a native leg\n' \
              "${{ matrix.arch }}" "$host_machine" >&2
            exit 1
          fi
          printf '==> admin ACL E2E (native %s, %s): sha256 %s, %s\n' \
            "${{ matrix.arch }}" "$host_machine" \
            "$(sha256sum target/release/eqproxy | cut -d' ' -f1)" \
            "$(file -b target/release/eqproxy)"
          # The journey installs its own clients, writes under /srv, /etc and
          # /var/log, and uses setpriv to become uid 1000 / gid 2000, so it
          # runs as root. It exits 1 if any observation differs.
          sudo env EQPROXY_BIN="$PWD/target/release/eqproxy" \
            bash .github/scripts/admin-unix-acl-e2e.sh
